{% load static %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>
    /* =====================================================
       MYNTRA-INSPIRED PREMIUM FOOTER (FIXED ICONS)
    ===================================================== */
    :root {
        --footer-bg: #1e2029;
        --footer-text: #94969f;
        --footer-accent: #ff3f6c; /* Myntra Pink */
        --footer-border: rgba(255, 255, 255, 0.05);
    }

    .site-footer {
        background: var(--footer-bg);
        color: var(--footer-text);
        padding: 60px 0 30px;
        font-family: 'Assistant', sans-serif;
        border-top: 1px solid var(--footer-border);
    }

    .footer-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .footer-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 40px;
        margin-bottom: 50px;
    }

    .footer-title {
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 25px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
    }

    .footer-text {
        font-size: 14px;
        line-height: 1.8;
        color: #94969f;
    }

    .footer-links {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .footer-links li { margin-bottom: 12px; }

    .footer-links a {
        color: #94969f;
        font-size: 14px;
        text-decoration: none;
        transition: 0.3s;
    }

    .footer-links a:hover {
        color: #ffffff;
        padding-left: 5px;
    }

    /* SOCIAL ICONS FIX */
    .footer-social {
        display: flex;
        gap: 15px;
        margin-top: 10px;
    }

    .footer-social a {
        width: 35px;
        height: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff !important; /* Force color to show */
        font-size: 18px;
        transition: all 0.3s ease;
        text-decoration: none;
    }

    .footer-social a:hover {
        background: var(--footer-accent);
        transform: translateY(-5px);
    }

    .footer-bottom {
        border-top: 1px solid var(--footer-border);
        padding-top: 30px;
        text-align: center;
    }

    .footer-bottom p { font-size: 14px; color: #7e818c; margin: 0; }

    .dev-credit {
        margin-top: 8px;
        display: block;
        color: #535766;
        font-size: 12px;
        text-transform: uppercase;
    }

    .dev-credit strong { color: #ffffff; }

    /* Mobile Responsive */
    @media (max-width: 767px) {
        .footer-grid { grid-template-columns: 1fr; text-align: center; }
        .footer-social { justify-content: center; }
    }
</style>

<footer class="site-footer">
  <div class="footer-container">

    <div class="footer-grid">

      <div class="footer-col">
        <h6 class="footer-title">About</h6>
        <p class="footer-text">
          Trivon is a premium e-commerce platform focused on sophisticated design and a seamless user experience.
        </p>
      </div>

      <div class="footer-col">
        <h6 class="footer-title">Help</h6>
        <ul class="footer-links">
          <li><a href="#">Support</a></li>
          <li><a href="#">Shipping</a></li>
          <li><a href="#">Returns</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h6 class="footer-title">Contact</h6>
        <p class="footer-text">
          <span><i class="fa fa-envelope" style="color:var(--footer-accent); margin-right:5px;"></i> support@trivon.com</span><br>
          <span><i class="fa fa-phone" style="color:var(--footer-accent); margin-right:5px;"></i> +1 800 123 4567</span>
        </p>
      </div>

      <div class="footer-col">
        <h6 class="footer-title">Keep in Touch</h6>
        <div class="footer-social">
          <a href="#" aria-label="Facebook"><i class="fa fa-facebook"></i></a>
          <a href="#" aria-label="Twitter"><i class="fa fa-twitter"></i></a>
          <a href="#" aria-label="Instagram"><i class="fa fa-instagram"></i></a>
        </div>
      </div>

    </div>

    <div class="footer-bottom">
      <p>© 2026 Trivon. All rights reserved.</p>
      <span class="dev-credit">Developed by <strong>Sahil Arote</strong></span>
    </div>

  </div>
</footer>
