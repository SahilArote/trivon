<style>
/* ================= SIDEBAR & MOBILE NAV CSS (MOBILE-FIRST) ================= */
:root {
    --m-pink: #ff3f6c;
    --m-dark: #282c3f;
    --m-gray: #94969f;
    --m-bg: #f5f5f6;
    --m-border: #eaeaec;
    --sidebar-width: 260px;
}

/* --- Mobile Navigation Header --- */
.mobile-top-nav {
    display: flex;
    padding: 15px 20px;
    background: #fff;
    border-bottom: 1px solid var(--m-border);
    justify-content: space-between;
    align-items: center;
    position: fixed;
    top: 65px;
    left: 0;
    right: 0;
    z-index: 1000;
    width: 100%;
}

.mobile-top-nav span {
    font-weight: 700;
    font-size: 14px;
    color: var(--m-dark);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.menu-trigger {
    background: none;
    border: none;
    font-size: 14px;
    color: var(--m-pink);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* --- Off-Canvas Sidebar (Mobile Default) --- */
.dashboard-sidebar {
    position: fixed;
    top: 0;
    left: -280px;
    width: 280px;
    height: 100vh;
    background: #fff;
    z-index: 1050;
    transition: left 0.3s ease;
    box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    overflow-y: auto;
}

.dashboard-sidebar.open {
    left: 0;
}

.sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(40, 44, 63, 0.7);
    z-index: 1040;
    backdrop-filter: blur(2px);
}

.sidebar-overlay.show {
    display: block;
}

/* --- Sidebar Content Styling --- */
.sidebar-heading {
    padding: 20px;
    font-size: 12px;
    font-weight: 700;
    color: var(--m-gray);
    text-transform: uppercase;
    border-bottom: 1px solid var(--m-border);
    letter-spacing: 1px;
}

.dashboard-menu {
    list-style: none;
    padding: 10px 0;
    margin: 0;
}

.dashboard-menu a {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    color: var(--m-dark);
    text-decoration: none;
    font-size: 14px;
    transition: background 0.2s, color 0.2s;
    border-left: 3px solid transparent;
}

.dashboard-menu a i {
    margin-right: 15px;
    width: 18px;
    color: #686b78;
    text-align: center;
}

.dashboard-menu a:hover {
    background: #f5f5f6;
    color: var(--m-pink);
}

.dashboard-menu a.active {
    color: var(--m-pink);
    background: #f5f5f6;
    border-left-color: var(--m-pink);
    font-weight: 700;
}

.dashboard-menu a.active i {
    color: var(--m-pink);
}

.logout-box {
    padding: 20px;
    border-top: 1px solid var(--m-border);
    margin-top: 10px;
}

.logout-btn {
    display: block;
    width: 100%;
    padding: 12px;
    text-align: center;
    color: var(--m-dark);
    border: 1px solid var(--m-border);
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
    transition: 0.2s;
}

.logout-btn:hover {
    background: var(--m-pink);
    color: #fff;
    border-color: var(--m-pink);
}

/* ================= DESKTOP (min-width: 768px) ================= */
@media (min-width: 768px) {
    /* Hide mobile nav header on desktop */
    .mobile-top-nav { 
        display: none; 
    }
    
    /* Hide overlay on desktop */
    .sidebar-overlay { display: none !important; }

    /* Change sidebar from off-canvas to locked grid column */
    .dashboard-sidebar {
        position: sticky;
        top: 20px; /* Lock it 20px from top during scroll */
        left: 0;
        width: var(--sidebar-width);
        height: fit-content;
        box-shadow: none;
        border: 1px solid var(--m-border);
        border-radius: 4px;
        z-index: 10;
        overflow-y: visible;
        transition: none;
    }
}
</style>

<!-- Mobile Sticky Nav -->
<div class="mobile-top-nav">
    <span>MY ACCOUNT</span>
    <button class="menu-trigger" onclick="toggleSidebar()">
        <i class="fa fa-bars"></i> MENU
    </button>
</div>

<!-- Mobile Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- The Sidebar Details -->
<aside class="dashboard-sidebar" id="dashboardSidebar">
    <div class="sidebar-heading">Account Overview</div>
    
    <nav class="dashboard-menu">
        <a href="{% url 'dashboard' %}" class="{% if '/dashboard/' in request.path %}active{% endif %}">
            <i class="fa fa-th-large"></i> Overview
        </a>
        <a href="{% url 'my_orders' %}" class="{% if '/my_orders/' in request.path %}active{% endif %}">
            <i class="fa fa-shopping-bag"></i> Orders
        </a>
        <a href="{% url 'edit_profile' %}" class="{% if '/edit_profile/' in request.path %}active{% endif %}">
            <i class="fa fa-user"></i> Profile Details
        </a>
        <a href="{% url 'change_password' %}" class="{% if '/change_password/' in request.path %}active{% endif %}">
            <i class="fa fa-lock"></i> Change Password
        </a>
    </nav>
    
    <div class="logout-box">
        <a href="{% url 'logout' %}" class="logout-btn">LOG OUT</a>
    </div>
</aside>

<!-- Logic for Mobile Sidebar Toggle -->
<script>
function toggleSidebar() {
    const sidebar = document.getElementById('dashboardSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    
    // Toggle classes
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
    
    // Lock body scroll when sidebar is open on mobile
    if (sidebar.classList.contains('open')) {
        document.body.style.overflow = 'hidden';
    } else {
        document.body.style.overflow = 'auto';
    }
}
</script>
