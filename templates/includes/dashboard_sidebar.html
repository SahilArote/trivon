<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>
/* ================= MYNTRA-STYLE SIDEBAR & MOBILE NAV ================= */
:root {
    --m-pink: #ff3f6c;
    --m-dark: #282c3f;
    --m-gray: #94969f;
    --m-border: #eaeaec;
}

/* Mobile Header Fix */
.mobile-account-nav {
    display: none;
    padding: 15px 20px;
    background: #fff;
    border-bottom: 1px solid var(--m-border);
    position: fixed;
    top: 0;
    z-index: 100;
    justify-content: space-between;
    align-items: center;
}

.dashboard-sidebar {
    width: 260px;
    background: #fff;
    border-right: 1px solid var(--m-border);
}

.sidebar-heading {
    padding: 20px;
    border-bottom: 1px solid var(--m-border);
    font-size: 12px;
    font-weight: 700;
    color: var(--m-gray);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.dashboard-menu {
    list-style: none;
    padding: 10px 0;
    margin: 0;
}

.dashboard-menu a {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    color: var(--m-dark);
    text-decoration: none;
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: 0.2s;
}

.dashboard-menu a i {
    margin-right: 15px;
    width: 20px;
    color: #686b78;
}

.dashboard-menu a:hover {
    background: #f5f5f6;
    color: var(--m-pink);
}

.dashboard-menu a.active {
    background: #f5f5f6;
    color: var(--m-pink);
    font-weight: 700;
    border-left-color: var(--m-pink);
}

.dashboard-menu a.active i { color: var(--m-pink); }

.logout-box {
    padding: 20px;
    border-top: 1px solid var(--m-border);
}

.logout-btn {
    display: block;
    padding: 10px;
    text-align: center;
    color: var(--m-dark);
    border: 1px solid var(--m-border);
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    border-radius: 4px;
}

/* ================= MOBILE SYSTEM FIXES ================= */
@media (max-width: 768px) {
    .mobile-account-nav { display: flex; }

    .dashboard-sidebar {
        position: fixed;
        top: 0;
        left: -100%; /* Fully hidden */
        height: 100vh;
        width: 280px;
        z-index: 9999; /* Higher than everything */
        transition: transform 0.3s ease;
        visibility: hidden;
        border-right: none;
    }

    .dashboard-sidebar.open {
        transform: translateX(145%);
        visibility: visible;
    }

    .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(40, 44, 63, 0.8);
        z-index: 9998; /* Just below sidebar */
        backdrop-filter: blur(4px);
    }

    .sidebar-overlay.show { display: block; }
}
</style>

<div class="mobile-account-nav">
    <span style="font-weight: 700; font-size: 16px;">MY ACCOUNT</span>
    <button onclick="toggleSidebar()" style="background:none; border:none; font-size:20px;">
        <i class="fa fa-bars"></i>
    </button>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<aside class="dashboard-sidebar" id="dashboardSidebar">
    <div class="sidebar-heading">Account Overview</div>
    <nav class="dashboard-menu">
        <a href="{% url 'dashboard' %}" class="{% if '/dashboard/' in request.path %}active{% endif %}">
            <i class="fa fa-th-large"></i> Overview
        </a>
        <a href="{% url 'my_orders' %}" class="{% if '/my_orders/' in request.path %}active{% endif %}">
            <i class="fa fa-shopping-bag"></i> Orders
        </a>
        <a href="{% url 'edit_profile' %}" class="{% if '/edit_profile/' in request.path %}active{% endif %}">
            <i class="fa fa-user"></i> Profile Details
        </a>
        <a href="{% url 'change_password' %}" class="{% if '/change_password/' in request.path %}active{% endif %}">
            <i class="fa fa-lock"></i> Change Password
        </a>
    </nav>
    <div class="logout-box">
        <a href="{% url 'logout' %}" class="logout-btn">LOG OUT</a>
    </div>
</aside>

<script>
function toggleSidebar() {
    const sidebar = document.getElementById('dashboardSidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
}
</script>
